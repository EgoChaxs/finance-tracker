[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker"
version = "0.1.0"
description = "Self-hosted finance tracker"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=7.1,<8",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",
    "src/create_user.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
